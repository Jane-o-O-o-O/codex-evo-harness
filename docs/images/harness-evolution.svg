<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="430" viewBox="0 0 1400 430" role="img" aria-labelledby="title desc">
  <title id="title">Harness evolution safety loop</title>
  <desc id="desc">Trace evidence flows through analysis, proposal, human approval, controlled application, verification, and rollback when verification fails.</desc>
  <style>
    text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .title { fill: #18232d; font-size: 21px; font-weight: 700; }
    .body { fill: #66737e; font-size: 14px; }
    .step { fill: #26323d; font-size: 16px; font-weight: 700; }
    .num { fill: #fff; font-size: 14px; font-weight: 700; text-anchor: middle; }
  </style>
  <rect width="1400" height="430" rx="8" fill="#f3f6f8"/>
  <text x="60" y="62" class="title">From trace evidence to a reversible Harness change</text>
  <text x="60" y="90" class="body">The analysis Agent can inspect and propose. Only an approved, exact operation can cross the write boundary.</text>

  <g transform="translate(60 132)">
    <rect width="210" height="150" rx="7" fill="#fff" stroke="#cfd8df"/>
    <circle cx="32" cy="34" r="16" fill="#397fc4"/><text x="32" y="39" class="num">1</text>
    <text x="60" y="40" class="step">Analyze</text>
    <text x="24" y="78" class="body">Query full or incremental</text><text x="24" y="102" class="body">Trace indexes within scope</text>
    <path d="M220 75h34" stroke="#7c8995" stroke-width="2"/><path d="M248 68l8 7-8 7" fill="none" stroke="#7c8995" stroke-width="2"/>

    <rect x="264" width="210" height="150" rx="7" fill="#fff" stroke="#cfd8df"/>
    <circle cx="296" cy="34" r="16" fill="#397fc4"/><text x="296" y="39" class="num">2</text>
    <text x="324" y="40" class="step">Propose</text>
    <text x="288" y="78" class="body">Attach evidence locator,</text><text x="288" y="102" class="body">target hash and exact diff</text>
    <path d="M484 75h34" stroke="#7c8995" stroke-width="2"/><path d="M512 68l8 7-8 7" fill="none" stroke="#7c8995" stroke-width="2"/>

    <rect x="528" width="210" height="150" rx="7" fill="#fffaf0" stroke="#dca42f" stroke-width="2"/>
    <circle cx="560" cy="34" r="16" fill="#dca42f"/><text x="560" y="39" class="num">3</text>
    <text x="588" y="40" class="step">Approve</text>
    <text x="552" y="78" class="body">Approve, edit, defer or</text><text x="552" y="102" class="body">reject each proposal</text>
    <path d="M748 75h34" stroke="#7c8995" stroke-width="2"/><path d="M776 68l8 7-8 7" fill="none" stroke="#7c8995" stroke-width="2"/>

    <rect x="792" width="210" height="150" rx="7" fill="#fff" stroke="#cfd8df"/>
    <circle cx="824" cy="34" r="16" fill="#397fc4"/><text x="824" y="39" class="num">4</text>
    <text x="852" y="40" class="step">Apply</text>
    <text x="816" y="78" class="body">Consume one-time token,</text><text x="816" y="102" class="body">snapshot, then mutate</text>
    <path d="M1012 75h34" stroke="#7c8995" stroke-width="2"/><path d="M1040 68l8 7-8 7" fill="none" stroke="#7c8995" stroke-width="2"/>

    <rect x="1056" width="210" height="150" rx="7" fill="#fff" stroke="#cfd8df"/>
    <circle cx="1088" cy="34" r="16" fill="#397fc4"/><text x="1088" y="39" class="num">5</text>
    <text x="1116" y="40" class="step">Verify</text>
    <text x="1080" y="78" class="body">Re-read target and test</text><text x="1080" y="102" class="body">discovery or connectivity</text>
  </g>

  <path d="M1218 310v42H856" fill="none" stroke="#c64f49" stroke-width="2" stroke-dasharray="7 6"/>
  <path d="M864 345l-9 7 9 7" fill="none" stroke="#c64f49" stroke-width="2"/>
  <rect x="575" y="326" width="270" height="54" rx="6" fill="#fff" stroke="#d8a19e"/>
  <text x="600" y="349" fill="#a83d38" font-size="14" font-weight="700">Verification failed</text>
  <text x="600" y="369" class="body">Restore the pre-change snapshot</text>
  <path d="M575 353H323v-44" fill="none" stroke="#c64f49" stroke-width="2" stroke-dasharray="7 6"/>
  <path d="M316 317l7-9 7 9" fill="none" stroke="#c64f49" stroke-width="2"/>
</svg>
